{% macro render_image_url(image_url, alt, additional_classes='', attrs={}) %}
<img src="{{ image_url or url_for('static', filename='fallback-image.png') }}"
  class="card__img img-cover {{ additional_classes }}" alt="{{ alt }}" loading="lazy" {% for key, value in attrs.items()
  %} {{ key }}="{{ value }}" {% endfor %} />
{% endmacro %}
