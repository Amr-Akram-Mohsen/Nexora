{% macro input(name="", type="text", id=None, value="", placeholder="", class="", required=True, attrs={}) %}
{% set type_variant_class =
'checkbox inline-flex items-center justify-center'
if type == 'checkbox' else 'input flex'
%}
<input type="{{ type }}" name="{{ name }}" id="{{ id or name }}" value="{{ value }}" placeholder="{{ placeholder }}" {%
  if required %}required{% endif %} {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {% endfor %}
  class="{{ type_variant_class }} {{ class_name }}">
{% endmacro %}
