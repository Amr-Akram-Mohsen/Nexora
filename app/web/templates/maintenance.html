<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scheduled Maintenance — Nexora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --background: #fafafa;
      --foreground: #171717;
      --card: #ffffff;
      --border: #e5e5e5;
      --brand-blue: #3b82f6;
      --brand-blue-dark: #1d4ed8;
      --muted-foreground: #737373;
      --radius-lg: 1rem;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0a0a0a;
        --foreground: #f5f5f5;
        --card: #141414;
        --border: #262626;
        --muted-foreground: #a3a3a3;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--background);
      color: var(--foreground);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      transition: background 0.3s, color 0.3s;
    }
    .maintenance-container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      padding: 3rem 2rem;
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: rgba(59, 130, 246, 0.08);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 2rem;
    }
    .icon {
      font-size: 2.5rem;
      animation: rotate 8s linear infinite;
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted-foreground);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(59, 130, 246, 0.1);
      color: var(--brand-blue);
      padding: 0.5rem 1rem;
      border-radius: 9999px;
      font-weight: 600;
      font-size: 0.875rem;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--brand-blue);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="maintenance-container">
    <div class="icon-wrapper">
      <span class="icon"><i class="fa-solid fa-gear"></i></span>
    </div>
    <h1>Under Maintenance</h1>
    <p>Nexora is currently undergoing scheduled platform updates to improve performance and stability. We will be back online shortly.</p>
    <div class="status-badge">
      <span class="status-dot"></span>
      <span>System Update in Progress</span>
    </div>
  </div>
</body>
</html>
