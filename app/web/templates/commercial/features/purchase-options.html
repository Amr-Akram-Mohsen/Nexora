<div class="item-buy-links">
  <h3 class="item-buy-links__title flex items-center">
    <span class="item-buy-links__bar"></span>
    Where to Buy
  </h3>
  <div class="item-buy-links__disclosure flex items-center">
    <i class="fas fa-info-circle"></i>
    <span class="disclosure-text">Affiliate links · We may earn a commission</span>
  </div>
  <div class="item-buy-links__items flex flex-col">
    {% for link in store_links %}
    <a href="{{ link.affiliate_url }}" target="_blank" rel="noopener noreferrer"
      class="link item-buy-link flex items-center justify-between" data-link-id="{{ link.id }}">

      <div class="item-buy-link__info flex items-center">
        <div class="item-buy-link__store flex items-center">
          {% if link.store.logo_url %}
          <img src="{{ url_for('static', filename=link.store.logo_url) }}" alt="{{ link.store.name }}"
            class="store-logo" loading="lazy" width="24" height="24">
          {% else %}
          <span class="store-logo-fallback flex-center">
            <i class="fas fa-store"></i>
          </span>
          {% endif %}
        </div>

        {% if link.price %}
        <div class="item-buy-link__price">
          {{ link.currency }}{{ link.price }}
        </div>
        {% endif %}
      </div>

      <span class="item-buy-link__cta flex items-center">
        Shop
        <i class="fas fa-arrow-right"></i>
      </span>
    </a>
    {% endfor %}
  </div>
</div>
