<div class="item-buy-links">
  <h3 class="item-buy-links__title">Where to Buy</h3>
  <div class="item-buy-links__disclosure flex items-center">
    <i class="fas fa-link mr-1"></i> <span class="disclosure-text">Affiliate links · We may earn a commission</span>
  </div>
  <div class="item-buy-links__items flex flex-col">
    {% for link in store_links %}
    <a href="{{ link.affiliate_url }}" target="_blank" rel="noopener noreferrer"
      class="link item-buy-link flex items-center justify-between" data-link-id="{{ link.id }}">
      <div class="item-buy-link__info flex flex-col">
        <div class="item-buy-link__store flex items-center">
          {% if link.store.logo_url %}
          <img src="{{ url_for('static', filename=link.store.logo_url)}}" alt="" class="store-logo" loading="lazy"
            width="24" height="24">
          {% endif %}
          {{ link.store.name }}
        </div>
        {% if link.price %}
        <div class="item-buy-link__price">
          {{ link.currency }}{{ link.price }}
        </div>
        {% endif %}
      </div>

      <!-- External link icon -->
      <span class="item-buy-link__icon">
        <i class="fas fa-external-link-alt"></i>
      </span>
    </a>
    {% endfor %}
  </div>
</div>
