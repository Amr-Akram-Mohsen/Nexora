<div class="item-grid">

    {% for item in related_items %}

    <a href="{{ url_for('item.item_page', item_id=item.id) }}" class="item-card">

        <div class="item-card__image">
            {% if item.image_url %}
            <img src="{{ item.image_url }}" alt="{{ item.name }}" loading="lazy">
            {% else %}
            <div class="item-card__image-placeholder flex-center">
                <i class="fas fa-box-open"></i>
            </div>
            {% endif %}
        </div>

        <div class="item-card__body">

            {% if item.brand %}
            <div class="item-card__brand">{{ item.brand.name }}</div>
            {% endif %}

            <h3 class="item-card__title">{{ item.name }}</h3>

            {% if item.min_price %}
            <div class="item-card__price">
                <span class="item-card__price-amount">{{ item.min_price }}</span>
                <span class="item-card__price-currency">SAR</span>
            </div>
            {% endif %}

        </div>

    </a>

    {% endfor %}

</div>
