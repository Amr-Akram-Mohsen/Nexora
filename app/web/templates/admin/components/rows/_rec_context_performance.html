{% if items %}
    {% for r in items %}
    <tr>
        <td>{{ badge(r.context_id, variant="secondary") }}</td>
        <td>{{ badge(r.entity_type, variant="secondary") }}</td>
        <td>{{ r.impressions }}</td>
        <td>{{ r.clicks }}</td>
        <td class="col-metric font-bold">{{ r.ctr }}</td>
    </tr>
    {% endfor %}
{% else %}
    <tr><td colspan="5" class="text-center text-muted">No data available.</td></tr>
{% endif %}
