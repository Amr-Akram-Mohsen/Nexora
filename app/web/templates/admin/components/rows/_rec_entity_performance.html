{% if products %}
    {% for r in products %}
    <tr>
        <td class="font-bold">{{ r.entity_name }}</td>
        <td>{{ badge(r.entity_type, variant="secondary") }}</td>
        <td class="col-metric">{{ r.clicks }}</td>
    </tr>
    {% endfor %}
{% else %}
    <tr><td colspan="3" class="text-center text-muted">No data available.</td></tr>
{% endif %}
