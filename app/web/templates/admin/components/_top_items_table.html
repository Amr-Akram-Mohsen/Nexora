<div class="top-content-mini-table">
  {% if items %}
  <table class="dashboard-table">
    <thead>
      <tr>
        <th>Product Name</th>
        <th>Clicks</th>
      </tr>
    </thead>
    <tbody>
      {% for item in items %}
      <tr>
        <td>
            <div class="flex items-center gap-2">
                {% if item.image_url %}
                    <img src="{{ item.image_url }}" alt="Thumbnail" class="item-thumbnail-small">
                {% else %}
                    <span class="badge badge-secondary" title="No Image"><i class="fa-regular fa-image"></i></span>
                {% endif %}
                <a href="/admin/items?search={{ item.id }}" class="activity-target inspect-link">{{ item.name }}</a>
            </div>
        </td>
        <td>{{ item.click_count or 0 }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  {% else %}
  <div>No items found.</div>
  {% endif %}
</div>
