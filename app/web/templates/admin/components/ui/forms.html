{% macro admin_filter_select(id, name, options, default_val="", default_text="All", extra_class="", attrs="") %}
<select id="{{ id }}" {% if name %}name="{{ name }}" {% endif %} class="dashboard-filter-select {{ extra_class }}"
  data-default-value="{{ default_val }}" {{ attrs }}>
  {% if default_text %}
  <option value="{{ default_val }}" {% if not options or default_val not in (options|map('first')|list if options and options[0] is sequence and options[0] is not string else options) %}selected{% endif %}>{{ default_text }}</option>
  {% endif %}
  {% for opt in options %}
  {% if opt is string or opt is number %}
  <option value="{{ opt }}" {% if opt == default_val %}selected{% endif %}>{{ opt }}</option>
  {% else %}
  <option value="{{ opt[0] }}" {% if opt[0] == default_val %}selected{% endif %}>{{ opt[1] }}</option>
  {% endif %}
  {% endfor %}
</select>
{% endmacro %}
