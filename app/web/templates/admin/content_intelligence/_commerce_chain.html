<div class="insights-table-scroll">
  <table class="admin-table">
    <thead>
      <tr>
        <th>Content Piece (Article)</th>
        <th>Commerce Transition Volume</th>
        <th>Funnel Rank</th>
      </tr>
    </thead>
    <tbody>
      {% for item in data %}
      <tr>
        <td><strong>{{ item.title }}</strong><br><small>Content ID: {{ item.content_id }}</small></td>
        <td><strong>{{ item.recommendation_clicks }}</strong> product clicks generated</td>
        <td><span class="status-badge badge-blue">#{{ loop.index }} Commerce Funnel</span></td>
      </tr>
      {% else %}
      <tr>
        <td colspan="3">No commerce chain data available.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
