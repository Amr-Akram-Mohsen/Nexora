<div class="coverage-chart-container">
  <canvas id="coverageMatrixChart"></canvas>
</div>

{% set matrix_data = [] %}
{% for item in items %}
  {% set _ = matrix_data.append({
    "x": item.content_count,
    "y": item.demand_score,
    "name": item.name,
    "gapScore": item.gap_score
  }) %}
{% endfor %}

<script id="coverage-matrix-data" type="application/json">
{{ matrix_data | tojson | safe }}
</script>
<script src="{{ url_for('static', filename='js/admin/pages/insights/coverageMatrix.js') }}"></script>
