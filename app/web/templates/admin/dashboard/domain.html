{% extends "admin/layout/admin_base.html" %}

{% block title %}{{ title }} — Nexora Admin{% endblock %}

{% block admin_content %}

<div class="admin-page-header">
  <div class="admin-page-header-row">
    <div>
      <h1>{{ title }}</h1>
      <p>Browse, search, filter and manage {{ domain }} records</p>
    </div>
    <div class="admin-page-header-actions">
      <button class="admin-btn-secondary" onclick="renderLoad('{{ domain }}')">↺ Refresh</button>
    </div>
  </div>
</div>

<div id="{{ domain }}-container"></div>

{% endblock %}

{% block admin_scripts %}
<script src="{{ url_for('static', filename='js/admin/dashboard/core.js') }}"></script>
<script>
  renderLoad("{{ domain }}");
</script>
{% endblock %}
