{% if not items or items | length == 0 %}
<div class="dashboard-empty loading-height-sm">
  <span class="dashboard-state-icon"><i class="fa-regular fa-envelope-open"></i></span>
  <p class="empty-message">No data yet.</p>
</div>
{% else %}
<ol class="overview-top-list">
  {% for item in items %}
    <li class="overview-top-item flex items-center">
      <span class="overview-top-rank">{{ loop.index }}</span>
      <span class="overview-top-name">
        <a class="overview-top-link-title" href="/admin/contents?search={{ item.id }}" title="{{ item.title or '—' }}">
          {{ item.title or '—' }}
        </a>
      </span>
      <span class="overview-top-value">{{ "{:,}".format(item.view_count or 0) }} views</span>
    </li>
  {% endfor %}
</ol>
{% endif %}
