{% if data %}
  {% for product in data %}
    <li class="overview-top-product flex items-center justify-between">
      <div class="overview-top-rank">
        #{{ loop.index }}
      </div>
      <div class="overview-top-name flex-1">
        <a href="/admin/products?search={{ product.id }}" class="overview-top-link-title" title="{{ product.name }}">
          {{ product.name }}
        </a>
      </div>
      <div class="overview-top-value flex flex-col items-end">
        <div class="overview-top-ctr">
          {{ product.ctr }}% CTR
        </div>
        <div class="overview-top-metrics flex gap-2 justify-end">
          <span title="Save Rate"><i class="fa-solid fa-bookmark overview-top-metric-icon--save"></i>{{ product.save_rate }}%</span>
          <span title="Like Rate"><i class="fa-solid fa-heart overview-top-metric-icon--like"></i>{{ product.like_rate }}%</span>
        </div>
      </div>
    </li>
  {% endfor %}
{% else %}
  <div class="overview-empty">No engagement data available.</div>
{% endif %}
