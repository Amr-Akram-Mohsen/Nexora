{% from "admin/components/ui/dashboard.html" import ranked_list_item %}
{% if data %}
  {% for item in data[:5] %}
    {% set badge_html = '<span class="badge" style="background: rgba(var(--brand-green-rgb), 0.1); color: var(--brand-green);">' ~ item.avg_rate|round(1) ~ '%</span>' %}
    {{ ranked_list_item(loop.index, item.name, badge_html) }}
  {% endfor %}
{% else %}
  <li class="text-center w-full py-4 text-muted">No commission data found.</li>
{% endif %}
