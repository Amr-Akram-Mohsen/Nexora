{% from "admin/components/crud.html" import admin_crud_rows %}

{% macro render_row(b) %}
<tr id="brand-row-{{ b.id }}">
  <td><span class="cell-primary-text cell-name">{{ b.name }}</span></td>
  <td>{{ b.industry or "—" }}</td>
  <td>
    <label class="admin-toggle">
      <input type="checkbox" class="admin-toggle-input" data-action="toggle-brand"
             data-id="{{ b.id }}" {{ "checked" if b.is_active else "" }} />
      <span class="status-badge {{ 'active' if b.is_active else 'inactive' }}">
        {{ "Active" if b.is_active else "Inactive" }}
      </span>
    </label>
  </td>
  <td>
    <span class="status-badge {{ 'admin' if b.is_featured else 'user' }}">
      {{ "Featured" if b.is_featured else "—" }}
    </span>
  </td>
  <td>
    <button class="btn-text-subtle-danger" data-action="delete-brand"
            data-id="{{ b.id }}" data-name="{{ b.name }}">🗑</button>
  </td>
</tr>
{% endmacro %}

{{ admin_crud_rows(items, render_row, colspan=5, empty_text="No brands found.") }}
