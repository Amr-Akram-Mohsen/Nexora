{% from "admin/components/crud.html" import admin_crud_rows %}

{% macro render_row(cat) %}
<tr id="category-row-{{ cat.id }}">
  <td><span class="cell-primary-text cell-name">{{ cat.name }}</span></td>
  <td>
    <label class="admin-toggle" title="Toggle active">
      <input type="checkbox" class="admin-toggle-input" data-action="toggle-category"
             data-id="{{ cat.id }}" {{ "checked" if cat.is_active else "" }} />
      <span class="status-badge {{ 'active' if cat.is_active else 'inactive' }}">
        {{ "Active" if cat.is_active else "Inactive" }}
      </span>
    </label>
  </td>
  <td>
    <span class="status-badge {{ 'user' if cat.is_leaf else 'admin' }}">
      {{ "Leaf" if cat.is_leaf else "Parent" }}
    </span>
  </td>
  <td>
    <button class="btn-text-subtle-danger" data-action="delete-category"
            data-id="{{ cat.id }}" data-name="{{ cat.name }}">🗑</button>
  </td>
</tr>
{% endmacro %}

{{ admin_crud_rows(items, render_row, colspan=4, empty_text="No categories found.") }}
