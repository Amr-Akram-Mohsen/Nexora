{% from "admin/components/crud.html" import admin_crud_rows %}

{% macro render_row(t) %}
<tr id="topic-row-{{ t.id }}">
  <td><span class="cell-name">{{ t.name }}</span></td>
  <td>
    <label class="admin-toggle">
      <input type="checkbox" class="admin-toggle-input" data-action="toggle-topic"
             data-id="{{ t.id }}" {{ "checked" if t.is_active else "" }} />
      <span class="status-badge {{ 'active' if t.is_active else 'inactive' }}">
        {{ "Active" if t.is_active else "Inactive" }}
      </span>
    </label>
  </td>
  <td>
    <span class="status-badge {{ 'admin' if t.is_featured else 'user' }}">
      {{ "Featured" if t.is_featured else "—" }}
    </span>
  </td>
  <td>
    <button class="btn-text-subtle-danger" data-action="delete-topic"
            data-id="{{ t.id }}" data-name="{{ t.name }}">🗑</button>
  </td>
</tr>
{% endmacro %}

{{ admin_crud_rows(items, render_row, colspan=4, empty_text="No topics found.") }}
