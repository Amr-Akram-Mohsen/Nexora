{% from "admin/components/crud.html" import admin_crud_rows %}

{% macro render_row(s) %}
<tr id="section-row-{{ s.id }}">
  <td><span class="cell-primary-text cell-name">{{ s.name }}</span></td>
  <td class="text-muted" style="max-width:260px;white-space:normal;">{{ s.description or "" }}</td>
  <td>
    <label class="admin-toggle">
      <input type="checkbox" class="admin-toggle-input" data-action="toggle-section"
             data-id="{{ s.id }}" {{ "checked" if s.is_active else "" }} />
      <span class="status-badge {{ 'active' if s.is_active else 'inactive' }}">
        {{ "Active" if s.is_active else "Inactive" }}
      </span>
    </label>
  </td>
  <td></td>
</tr>
{% endmacro %}

{{ admin_crud_rows(items, render_row, colspan=4, empty_text="No sections found.") }}
