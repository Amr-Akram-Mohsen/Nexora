{% if data %}
  <ul class="top-saves-list">
    {% for s in data %}
      {% set icon = '📄' if s.target_type == 'content' else '📦' %}
      <li class="top-saves-item flex items-center justify-between">
        <span class="top-saves-name"><span class="top-saves-icon">{{ icon }}</span>{{ s.name }}</span>
        <span class="top-saves-count">{{ s.count }}</span>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="top-saves-empty">No saves recorded.</p>
{% endif %}
