{% macro render_image_url(image_url, alt, additional_classes='', attrs={}) %}
<div class="image-wrapper {{ additional_classes }}">
  {% if image_url %}
  <img src="{{ image_url }}" class="card__img img-cover"
    alt="{{ alt or 'Content Image' }}" loading="lazy" {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {%
    endfor %} />
  {% else %}
  <div class="image-placeholder card__img">
    <div class="image-placeholder__inner">
      <i class="fas fa-layer-group image-placeholder__icon"></i>
      <span class="image-placeholder__text">Nexora</span>
    </div>
  </div>
  {% endif %}
</div>
{% endmacro %}
