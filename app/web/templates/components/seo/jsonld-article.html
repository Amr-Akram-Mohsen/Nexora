{% macro render_article_jsonld(content) %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ content.target.title | e }}",
  "image": [
    "{{ url_for('static', filename=content.target.image_url, _external=True) if content.target.image_url else '' }}"
  ],
  "datePublished": "{{ content.published_at | format_date('%Y-%m-%dT%H:%M:%S%z') }}",
  "author": [{
      "@type": "Organization",
      "name": "Nexora",
      "url": "{{ request.host_url }}"
  }]
}
</script>
{% endmacro %}
