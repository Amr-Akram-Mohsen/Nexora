{% macro render_product_jsonld(product) %}
<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ product.name | e }}",
  "image": [
    "{{ url_for('static', filename=product.image_url, _external=True) if product.image_url else '' }}"
  ],
  "description": "{{ product.quick_details | e if product.quick_details else '' }}",
  "sku": "{{ product.default_variant.sku if product.default_variant else '' }}",
  "brand": {
    "@type": "Brand",
    "name": "{{ product.brand.name if product.brand else '' }}"
  },
  "offers": {
    "@type": "AggregateOffer",
    "url": "{{ request.url }}",
    "priceCurrency": "{{ product.default_variant.currency if product.default_variant else 'USD' }}",
    "lowPrice": "{{ product.min_price if product.min_price else (product.price if product.price else '0.00') }}",
    "offerCount": "{{ product.stores | length }}"
  }
}
</script>
{% endmacro %}
