{% macro grid(items, target_type="content", carousel=false) %}
<div class="{{ 'grid-carousel' if carousel else 'grid-auto' }}"
  data-expandable-grid="{{ 'false' if carousel else 'true' }}">
  {% for item in items %}
  {% include target_type ~ "/dispatcher/card.html" %}
  {% endfor %}
</div>
{% endmacro %}
