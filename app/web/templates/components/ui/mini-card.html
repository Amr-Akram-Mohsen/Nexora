<a href="{{ url_for('content.content_page', content_id=product.id) }}"
    class="mini-card flex flex-col gap-1">
    {% if product.target and product.target.image_url %}
    <div class="mini-card__image">
        <img src="{{ product.target.image_url }}" alt="{{ product.target.title }}" loading="lazy">
    </div>
    {% endif %}
    <div class="mini-card__content">
        <h4 class="mini-card__title" title="{{ product.target.title }}">{{ product.target.title }}</h4>
        <div class="mini-card__meta flex items-center gap-1 flex-wrap">
            {% if product.source %}
            <span class="mini-card__source">{{ product.source.name }}</span>
            <span class="mini-card__dot flex-shrink-0"></span>
            {% endif %}
            <time class="mini-card__date">{{ product.published_at | format_date('%b %d') }}</time>
        </div>
    </div>
</a>
