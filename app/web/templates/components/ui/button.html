{% macro button(text="", btn_span_class="", type="button", variant="primary", class="", icon=None, attrs={}) %}
<button type="{{ type }}"
  class="btn{% if variant is not none %} variant--{{ variant }} btn--{{ variant }}{% endif %} {{ class }} inline-flex-center"
  {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {% endfor %}>
  {% if icon %}
  <i class="{{ icon }}"></i>
  {% endif %}

  {% if text %}
  <span class="btn-text {{ btn_span_class }}">
    {{ text }}
  </span>
  {% endif %}
  {% if caller is defined %}
  {{ caller() }}
  {% endif %}
</button>
{% endmacro %}
