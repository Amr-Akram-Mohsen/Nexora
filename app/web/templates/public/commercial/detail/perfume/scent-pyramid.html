{% set scent = product.structured_details.get('scent') %}

{% if scent %}
<div class="scent-pyramid flex flex-col items-center">

  {% for layer, notes in scent.items() if notes %}
  <div class="pyramid-layer pyramid-layer--{{ layer }}">
    <span>{{ layer }}</span>
    <p>{{ notes }}</p>
  </div>
  {% endfor %}

</div>
{% endif %}
