{% macro render_stars(rating) %}
{% set rating_val = rating or 0 %}
{% set full = rating_val | int %}
{% set half = (rating_val - full) >= 0.5 %}

{% for _ in range(full) %}
<i class="fas star fa-star"></i>
{% endfor %}

{% if half %}
<i class="fas star fa-star-half-alt"></i>
{% endif %}

{% for _ in range(5 - full - (1 if half else 0)) %}
<i class="far star fa-star"></i>
{% endfor %}
{% endmacro %}
