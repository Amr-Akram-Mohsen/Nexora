{% macro render_image_url(image_url, alt, additional_classes='', attrs={}, priority='low') %}
<div class="image-wrapper flex-center {{ additional_classes }} flex justify-center items-center">
  <img src="{{ image_url or url_for('static', filename='logo.png') }}" class="card__img img-cover"
    alt="{{ alt or 'Product Image' }}"
    {% if priority == 'high' %}fetchpriority="high"{% else %}loading="lazy"{% endif %}
    {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {% endfor %} />
</div>
{% endmacro %}
