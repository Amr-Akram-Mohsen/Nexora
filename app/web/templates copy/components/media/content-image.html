{% macro render_image_url(image_url, alt, additional_classes='', attrs={}) %}
<div class="image-wrapper {{ additional_classes }}">
  <img src="{{ image_url or url_for('static', filename='fallback-image.png') }}" class="card__img img-cover"
    alt="{{ alt or 'Content Image' }}" loading="lazy" {% for key, value in attrs.items() %} {{ key }}="{{ value }}" {%
    endfor %} />
</div>

<style>
  .image-wrapper {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card__img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.4s ease;
  }

  .card__img.is-fallback {
    object-fit: contain;
    padding: 2rem;
    opacity: 0.5;
    filter: grayscale(1);
  }

  .card:hover .card__img:not(.is-fallback) {
    transform: scale(1.05);
  }
</style>
{% endmacro %}
